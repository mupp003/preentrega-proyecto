<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>prueba css clase 4</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        } 
        h2 {
            color: #031ff6;
        }
 /* con h2 estoy diciendo que sea azul todos los textos que sean h2 pd: todo lo escrito en styles cuenta como css no como html por eso el comentario es diferente */
        h4 {
            color: #f60303;
        }
        span {
            color: #f60303;
        }
    </style>


</head>
<body>
    <header>
        <a href="../index.html">
            <img src="./icono.png.png" alt="logo de estrellita culona"width="100" height="auto">
        </a>
        <nav></nav>
    </header>
        <main>
            <!--- banner --->
            <section>
                <h4>Bienvenido a nuestra página</h4> <!--- este es style de linea no se suele usar por la masividad pero sirve para modificar una linea de texto --->
                <h2>Nuestros <span>servicios</span> y productos</h2>
                <input type="button" value="Ver más">
                <button>Ver más</button>
            </section>
        </main>
</body>
<!--- input type="button" - y button hacen lo mismo pero type podes usar checkbox,password,etc-->
<!--- el tipo es importante a la hora de elegir-->
</html>

<!--- y tampoco se usa mucho la pestaña styles dentro como lo puse arriba la practica mas comun y mejor para hacer las cosas y editar en masa es crear un archivo .css --->
