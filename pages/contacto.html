<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>correo</title>
        <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <a href="../index.html">
            <img src="../img/icono.png" alt="trifuerza"width="100" height="auto">
        </a>
    </header>
    <main>
        <!--- formulario de contacto-->
        <span>Deja un mensaje</span>
        <h2>queremos saber de ti</h2>
    <section>
        <form action="https://formspree.io/f/xaenqqvv" method="post">
            <div>
                <legend>Formulario de contacto</legend>
                <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
            </div>
            <div>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Tu email" required>
            </div>
            <div>
                <input type="text" id="asunto" name="asunto" placeholder="Asunto del mensaje" required>
            </div>
            <div>    
                <label for="mensaje">Mensaje:</label>
                <textarea id="mensaje" name="mensaje" placeholder="Tu mensaje" required></textarea>
            </div>
            <div>
                <label for="desplegable">desplegable:</label>
                <select id="desplegable" name="desplegable">
                     <option value="">Seleccione una opción</option>
                    <option value="consulta">consulta</option>
                    <option value="sugerencia">sugerencia</option>
                </select>
            </div>
            <div>
                <input type="submit" value="Enviar">
            </div>
        </form>
    </section>
    <!---reseñas-->
    <div class="reseñas">
        <h2>Reseñas</h2>
        <p>¡Excelente servicio! Muy recomendable.</p>
        <p>Me encantó la atención al cliente.</p>
    </div>

    <section>
        <!--- mapa-->
    </section>
    <section>
        <!--- newsletter-->
    </section>

    </main>
        <a href="../index.html">Volver a inicio</a>

</body>
</html>
